<!DOCTYPE html>
<html>
<head>
    <title>Generate App Icons</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .icon-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .icon {
            background: linear-gradient(135deg, #8b0000, #dc143c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        .icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }
        .icon-text {
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .splash {
            background: linear-gradient(135deg, #8b0000, #dc143c);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 8px 32px rgba(139, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .splash::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05) 0%, transparent 50%);
        }
        .splash-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .splash-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .splash-subtitle {
            font-size: 16px;
            opacity: 0.9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 14px;
        }
        .download-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>Meat Freshness Visualizer - App Icon Generator</h1>
    
    <h2>App Icons</h2>
    <div class="icon-container">
        <div class="icon" style="width: 108px; height: 108px;" id="icon-108">
            <div class="icon-text">MP</div>
        </div>
        <div class="icon" style="width: 144px; height: 144px;" id="icon-144">
            <div class="icon-text">MP</div>
        </div>
        <div class="icon" style="width: 192px; height: 192px;" id="icon-192">
            <div class="icon-text">MP</div>
        </div>
        <div class="icon" style="width: 512px; height: 512px;" id="icon-512">
            <div class="icon-text">MP</div>
        </div>
    </div>
    
    <h2>Splash Screens</h2>
    <div class="icon-container">
        <div class="splash" style="width: 320px; height: 240px;" id="splash-land">
            <div class="splash-content">
                <div class="splash-title">Meat Freshness</div>
                <div class="splash-subtitle">Visualizer</div>
            </div>
        </div>
        <div class="splash" style="width: 240px; height: 320px;" id="splash-port">
            <div class="splash-content">
                <div class="splash-title">Meat Freshness</div>
                <div class="splash-subtitle">Visualizer</div>
            </div>
        </div>
    </div>
    
    <div>
        <button class="download-btn" onclick="downloadIcon(108, 'icon-108')">Download 108x108</button>
        <button class="download-btn" onclick="downloadIcon(144, 'icon-144')">Download 144x144</button>
        <button class="download-btn" onclick="downloadIcon(192, 'icon-192')">Download 192x192</button>
        <button class="download-btn" onclick="downloadIcon(512, 'icon-512')">Download 512x512</button>
        <button class="download-btn" onclick="downloadSplash(320, 240, 'splash-land')">Download Splash Land</button>
        <button class="download-btn" onclick="downloadSplash(240, 320, 'splash-port')">Download Splash Port</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        function downloadIcon(size, elementId) {
            const element = document.getElementById(elementId);
            html2canvas(element, {
                width: size,
                height: size,
                scale: 1
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `icon-${size}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
        
        function downloadSplash(width, height, elementId) {
            const element = document.getElementById(elementId);
            html2canvas(element, {
                width: width,
                height: height,
                scale: 1
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `splash-${width}x${height}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
