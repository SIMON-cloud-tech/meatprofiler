<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc143c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shimmer" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" />
  
  <!-- Shimmer effect -->
  <circle cx="256" cy="256" r="240" fill="url(#shimmer)" />
  
  <!-- Meat icon -->
  <g transform="translate(256, 256)">
    <!-- Main meat shape -->
    <ellipse cx="0" cy="0" rx="120" ry="80" fill="#ff6b6b" opacity="0.8" />
    <ellipse cx="0" cy="-10" rx="100" ry="60" fill="#ff8787" opacity="0.6" />
    
    <!-- Text -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" text-shadow="0 2px 4px rgba(0,0,0,0.3)">MP</text>
  </g>
  
  <!-- Shadow -->
  <ellipse cx="256" cy="480" rx="200" ry="20" fill="#000000" opacity="0.2" />
</svg>
