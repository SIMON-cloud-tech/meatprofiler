
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meat Freshness Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Meat Freshness Visualizer</h1>
      <p>Estimate freshness using chemistry-based decay logic</p>
    </header>

    <main>
      <section class="input-section glass-card">
        <h2>Input Parameters</h2>
        
        <div class="form-group">
          <label for="meat-type">Meat Type:</label>
          <select id="meat-type">
            <option value="beef">Beef</option>
            <option value="pork">Pork</option>
            <option value="chicken">Chicken</option>
          </select>
        </div>

        <div class="form-group">
          <label for="temperature">Ambient Temperature (°C):</label>
          <input type="number" id="temperature" placeholder="e.g. 25" />
        </div>

        <div class="form-group">
          <label for="hours">Hours Since Slaughter:</label>
          <input type="number" id="hours" placeholder="e.g. 12" />
        </div>

        <button onclick="calculateFreshness()">Calculate Freshness</button>
      </section>

      <section class="output-section glass-card">
        <h2>Freshness Analysis</h2>
        <div id="freshness-meter">--</div>
        <p id="decay-tip"></p>
      </section>
    </main>

    <footer>
      <p>Powered by industrial chemistry logic</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
